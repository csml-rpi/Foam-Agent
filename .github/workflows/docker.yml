name: Docker configuration

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'examples/quickstart/**'
      - 'pyproject.toml'
      - 'constraints.txt'
      - 'environment.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [docker/Dockerfile, docker/Dockerfile.esi-v2006]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check setup script syntax
        run: bash -n docker/foamagent-entrypoint.sh docker/install-python.sh examples/quickstart/run.sh
      - uses: docker/setup-buildx-action@v4
      - name: Check Dockerfile without building an image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          call: check

  esi-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: docker/setup-buildx-action@v4
      - name: Build ESI runtime dependencies
        run: docker build --platform linux/amd64 --target runtime-deps -f docker/Dockerfile.esi-v2006 -t foamagent:esi-runtime-deps .
      - name: Verify Gmsh loads with the runtime libraries
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/constraints.txt:/tmp/constraints.txt:ro" \
            foamagent:esi-runtime-deps bash -c '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-pip
              python3 -m pip install --no-cache-dir --upgrade pip
              python3 -m pip install --no-cache-dir -c /tmp/constraints.txt gmsh
              python3 -c "import gmsh; gmsh.initialize(); gmsh.finalize()"
            '

name: Docker configuration

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'examples/quickstart/**'
      - 'pyproject.toml'
      - 'constraints.txt'
      - 'environment.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [docker/Dockerfile, docker/Dockerfile.esi-v2006]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check setup script syntax
        run: bash -n docker/foamagent-entrypoint.sh docker/install-python.sh examples/quickstart/run.sh
      - uses: docker/setup-buildx-action@v4
      - name: Check Dockerfile without building an image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          call: check
